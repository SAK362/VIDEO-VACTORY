name: asr-probe
on:
  push:
    branches: [webgl-engine]
    paths: ['.github/workflows/asr-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install --quiet numpy scipy faster-whisper
          mkdir -p work public
          python3 -c "
          import json
          p=json.load(open('webgl/diesel_props.json')); p['audioSeconds']=64.61
          json.dump(p,open('work/props.json','w'),ensure_ascii=False)"
          cp webgl/test/voiceover.wav public/voiceover.wav
          python webgl/clean_audio.py
          python webgl/asr_probe.py
