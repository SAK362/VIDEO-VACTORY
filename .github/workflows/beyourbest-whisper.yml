name: beyourbest-whisper

# BeYourBest: sementara, hanya untuk waktu kata Whisper. Dipicu push ke branch beyourbest-whisper-*.
on:
  push:
    branches: ['beyourbest-whisper-**']
    paths: ['beyourbest/whisper_tmp/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-medium-v1}
      - run: pip install --quiet faster-whisper
      - run: python beyourbest/whisper_tmp/words.py beyourbest/whisper_tmp/0003
      - uses: actions/upload-artifact@v4
        with: {name: words-0003, path: out/words.json, retention-days: 3}
