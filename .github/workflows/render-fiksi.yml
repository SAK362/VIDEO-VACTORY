name: render-fiksi

# FIKSI (cerita fiksi, gambar 3D + voice Gemini): 1080x1920, 30 fps, Python + ffmpeg.
# Dipicu n8n atau manual (workflow_dispatch). project = nama folder di fiksi/ (contoh: topik01).
# Alur: Whisper (waktu kata) -> render -> hasil di fiksi/outbox/ + artifact -> (opsional) lapor n8n.
on:
  workflow_dispatch:
    inputs:
      project: {description: 'Nama folder proyek di fiksi/ (contoh topik01)', required: true, default: topik01}
      callback_url: {description: 'URL webhook n8n (opsional)', required: false, default: ''}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sembunyikan URL dari log
        env: {CALLBACK_URL: '${{ inputs.callback_url }}'}
        run: |
          if [ -n "$CALLBACK_URL" ]; then echo "::add-mask::$CALLBACK_URL"; fi
      - uses: actions/checkout@v4
      - name: Pasang ffmpeg bila belum ada
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Cache model Whisper
        uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-medium-v1}
      - name: Pasang paket
        run: pip install --quiet numpy pillow faster-whisper
      - name: Waktu kata dengan Whisper
        run: python fiksi/align_job.py fiksi/${{ inputs.project }}
      - name: Render video
        run: |
          mkdir -p hasil
          python fiksi/render_fiksi.py fiksi/${{ inputs.project }} --out hasil
          ls -la hasil
      - name: Simpan hasil ke artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiksi-${{ inputs.project }}
          path: hasil/*
          retention-days: 7
      - name: Simpan hasil ke fiksi/outbox
        run: |
          mkdir -p fiksi/outbox
          cp hasil/*.mp4 hasil/*_thumbnail.png hasil/*_narasi.txt fiksi/outbox/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fiksi/outbox fiksi/${{ inputs.project }}/heard.json
          git diff --cached --quiet || (git commit -m "FIKSI ${{ inputs.project }}: hasil render" && git pull --rebase -q && git push)
      - name: Lapor n8n
        if: ${{ inputs.callback_url != '' }}
        env: {CALLBACK_URL: '${{ inputs.callback_url }}', PROJECT: '${{ inputs.project }}'}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' -d "{\"channel\":\"FIKSI\",\"project\":\"$PROJECT\",\"status\":\"ok\"}" "$CALLBACK_URL" || true
