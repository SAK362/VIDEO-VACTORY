name: align-beyourbest
on:
  push:
    paths: ["beyourbest/align/*.wav"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-medium-v1}
      - run: pip install --quiet faster-whisper
      - run: python beyourbest/align_job.py
      - name: Simpan hasil
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add beyourbest/align/*_heard.json
          git diff --cached --quiet || (git commit -m "BeYourBest: waktu kata Whisper" && git pull --rebase -q && git push)
