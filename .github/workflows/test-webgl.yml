name: test-webgl

# Mesin render 3D WebGL (Chrome headless): 1080x1920, 30 fps. Dipicu n8n (workflow_dispatch), input sama dengan "render".
# Alur: prep (unduh, rapikan suara, selaraskan kata dengan Whisper, buat timing.js)
#       -> render 8 potongan PARALEL -> gabung + suara -> unggah Drive -> lapor n8n.
on:
  push:
    branches: [webgl-engine]
    paths: ['.github/workflows/test-webgl.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pasang ffmpeg bila belum ada
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; fi
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Siapkan props dan suara uji
        run: |
          mkdir -p work public
          python3 - <<'PY'
          import json
          p = json.load(open('webgl/diesel_props.json')); p['audioSeconds'] = 64.61
          json.dump(p, open('work/props.json', 'w'), ensure_ascii=False)
          PY
          cp webgl/test/voiceover.wav public/voiceover.wav
      - name: Rapikan suara (jeda panjang, -14 LUFS)
        run: |
          pip install --quiet numpy
          python webgl/clean_audio.py
      - name: Cache model pengenal ucapan
        uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-medium-v1}
      - name: Selaraskan waktu kata dengan suara (Whisper)
        timeout-minutes: 15
        env: {PROPS_FILE: work/props.json, WAV_FILE: public/voiceover.wav}
        run: |
          pip install --quiet faster-whisper
          python webgl/align_whisper.py
      - name: Buat timing.js
        run: |
          pip install --quiet numpy
          python webgl/make_timing.py
          cp curio.png webgl/curio.png
          pip install --quiet playwright
      - name: Rencanakan adegan 3D (AI) dan periksa
        env: {ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}'}
        run: |
          python webgl/plan_scenes.py
          [ -f webgl/spec.json ] && python webgl/validate_spec.py webgl/spec.json || true
      - name: Hitung frame
        run: python webgl/render_webgl.py meta
      - name: Cetak waktu kata
        run: |
          python3 - <<'PY'
          import json, re
          d = json.loads(re.search(r'=(.*);\s*$', open('webgl/timing.js', encoding='utf-8').read(), re.S).group(1))
          print('WT', json.dumps([[w['start'], w['end']] for w in d['words']]))
          for si, sp in enumerate(d['sent_spans']): print('SENT', si + 1, sp)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: work
          path: |
            webgl/timing.js
            webgl/spec.js
            webgl/spec.json
            webgl/engine.txt
            webgl/curio.png
            public/voiceover.wav
          retention-days: 1

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {name: work, path: .}
      - name: Pasang ffmpeg dan Chrome bila belum ada
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; fi
          if [ ! -x /usr/bin/google-chrome ]; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          fi
          ffmpeg -version | head -1; google-chrome --version
      - name: Render potongan ${{ matrix.chunk }}
        run: |
          pip install --quiet playwright
          mkdir -p out
          START=$(date +%s)
          python webgl/render_webgl.py chunk ${{ matrix.chunk }} 8 out/seg${{ matrix.chunk }}.mp4
          echo "Potongan selesai dalam $(( $(date +%s) - START )) detik"
      - uses: actions/upload-artifact@v4
        with: {name: 'seg${{ matrix.chunk }}', path: 'out/seg${{ matrix.chunk }}.mp4', retention-days: 1}

  final:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Pasang ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: {path: parts, merge-multiple: true}
      - name: Gabung
        run: |
          for i in 0 1 2 3 4 5 6 7; do echo "file '$PWD/parts/seg$i.mp4'" >> list.txt; done
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy silent.mp4
          ffmpeg -v error -y -i silent.mp4 -i parts/public/voiceover.wav -c:v copy -c:a aac -b:a 192k video.mp4
          ls -lh video.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,duration -of csv video.mp4
      - uses: actions/upload-artifact@v4
        with: {name: video-test, path: video.mp4, retention-days: 3}
